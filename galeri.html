    <main>
        <h2>Galeri Desa Sintete</h2>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px;">

            <div style="text-align: center;">
                <img src="images/gerbang-pelabuhan.jpg"
                     alt="Gerbang Pelabuhan Sintete"
                     style="width:100%; border-radius:10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);">
                <p style="margin-top: 8px; font-weight: 500;">⚓ Gerbang Pelabuhan</p>
            </div>

            <div style="text-align: center;">
                <img src="images/kapal2_sintete.jpg"
                     alt="Kapal di Pelabuhan Sintete"
                     style="width:100%; border-radius:10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);">
                <p style="margin-top: 8px; font-weight: 500;">🚢 Kapal di Sintete</p>
            </div>

            <div style="text-align: center;">
                <img src="images/pertanian_2.jpg"
                     alt="Kegiatan Pertanian Sintete"
                     style="width:100%; border-radius:10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);">
                <p style="margin-top: 8px; font-weight: 500;">🌾 Pertanian</p>
            </div>

            <div style="text-align: center;">
                <img src="images/masjid.jpg"
                     alt="Masjid di Kawasan Sintete"
                     style="width:100%; border-radius:10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);">
                <p style="margin-top: 8px; font-weight: 500;">🕌 Masjid</p>
